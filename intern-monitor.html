<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>实习生比例监测 - 行业一部</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:#f5f5f5;color:#333;padding:24px}
.header{text-align:center;margin-bottom:24px}
.header h1{font-size:24px;font-weight:600}
.header p{font-size:14px;color:#888;margin-top:4px}
.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.card{background:#fff;border-radius:12px;padding:20px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.card .label{font-size:13px;color:#888;margin-bottom:8px}
.card .value{font-size:32px;font-weight:700}
.card .value.green{color:#52c41a}
.card .value.red{color:#ff4d4f}
.card .value.blue{color:#1890ff}
.card .value.orange{color:#fa8c16}
.chart-container,.bar-section{background:#fff;border-radius:12px;padding:24px;margin-bottom:24px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.chart-container h3,.bar-section h3{font-size:16px;font-weight:600;margin-bottom:16px}
canvas{max-width:100%}
</style>
</head>
<body>
<div class="header">
<h1>📊 行业一部实习生比例监测</h1>
<p>数据截至 2026-07-21 | 基准值 24.7%</p>
</div>
<div class="overview">
<div class="card"><div class="label">整体比例</div><div class="value green">16.2%</div></div>
<div class="card"><div class="label">实习生数</div><div class="value blue">28</div></div>
<div class="card"><div class="label">正式员工数</div><div class="value orange">173</div></div>
<div class="card"><div class="label">超标小组</div><div class="value red">6</div></div>
</div>
<div class="chart-container">
<h3>整体比例趋势</h3>
<canvas id="trendChart" height="100"></canvas>
</div>
<div class="bar-section">
<h3>各小组实习生比例</h3>
<canvas id="barChart" height="400"></canvas>
</div>
<script>
const dates = ["04-01", "04-02", "04-04", "04-06", "04-07", "04-08", "04-11", "04-12", "04-13", "04-14", "04-22", "05-15", "05-21", "05-22", "05-23", "05-25", "05-27", "06-01", "06-06", "06-14", "06-18", "06-19", "06-20", "06-21", "06-22", "06-28", "07-10", "07-15", "07-16", "07-17", "07-20", "07-21"];
const ratios = [24.1, 23.4, 24.1, 24.1, 24.1, 24.2, 23.5, 23.5, 23.5, 23.6, 22.3, 18.6, 18.6, 18.6, 18.6, 18.6, 18.6, 36.0, 18.9, 21.3, 21.3, 21.3, 21.3, 20.3, 21.4, 20.4, 16.2, 16.2, 16.2, 16.2, 16.2, 16.2];
const baseline = 24.7;

new Chart(document.getElementById('trendChart'), {
  type: 'line',
  data: {
    labels: dates,
    datasets: [{
      label: '实习生比例(%)',
      data: ratios,
      borderColor: '#1890ff',
      backgroundColor: 'rgba(24,144,255,0.1)',
      tension: 0.3,
      fill: true
    }, {
      label: '基准值',
      data: Array(dates.length).fill(baseline),
      borderColor: '#ff4d4f',
      borderDash: [5,5],
      fill: false,
      pointRadius: 0
    }]
  },
  options: {
    responsive: true,
    plugins: {
      annotation: {
        annotations: {
          line1: {
            type: 'line',
            yMin: baseline,
            yMax: baseline,
            borderColor: '#ff4d4f',
            borderWidth: 2,
            borderDash: [5,5]
          }
        }
      }
    },
    scales: {
      y: {
        beginAtZero: true,
        max: 80,
        ticks: {callback: v => v + '%'}
      }
    }
  }
});

new Chart(document.getElementById('barChart'), {
  type: 'bar',
  data: {
    labels: ["\u884c\u4e1a\u4e00\u7ec4", "\u884c\u4e1a\u4e8c\u7ec4", "\u884c\u4e1a\u4e09\u7ec4", "\u884c\u4e1a\u56db\u7ec4", "\u884c\u4e1a\u4e94\u7ec4", "\u884c\u4e1a\u516d\u7ec4", "\u884c\u4e1a\u4e03\u7ec4", "\u884c\u4e1a\u516b\u7ec4", "\u884c\u4e1a\u4e5d\u7ec4", "\u884c\u4e1a\u5341\u7ec4", "\u884c\u4e1a\u5341\u4e00\u7ec4", "\u884c\u4e1a\u5341\u4e8c\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u4e00\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u4e8c\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u4e09\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u56db\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u4e94\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u516d\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u4e03\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u516b\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u4e5d\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u5341\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u5341\u4e00\u7ec4", "\u5e73\u53f0\u4e13\u5bb6\u5341\u4e8c\u7ec4", "\u884c\u4e1a\u7b56\u7565\u7ec4"],
    datasets: [{
      data: [7.7, 10.0, 11.1, 33.3, 16.7, 11.1, 18.2, 16.7, 9.1, 11.1, 14.3, 25.0, 14.3, 12.5, 28.6, 33.3, 0.0, 16.7, 66.7, 16.7, 16.7, 12.5, 0.0, 33.3, 0.0],
      backgroundColor: ["#52c41a", "#52c41a", "#52c41a", "#ff4d4f", "#52c41a", "#52c41a", "#52c41a", "#52c41a", "#52c41a", "#52c41a", "#52c41a", "#ff4d4f", "#52c41a", "#52c41a", "#ff4d4f", "#ff4d4f", "#52c41a", "#52c41a", "#ff4d4f", "#52c41a", "#52c41a", "#52c41a", "#52c41a", "#ff4d4f", "#52c41a"]
    }]
  },
  options: {
    indexAxis: 'y',
    responsive: true,
    plugins: {
      annotation: {
        annotations: {
          line1: {
            type: 'line',
            xMin: baseline,
            xMax: baseline,
            borderColor: '#ff4d4f',
            borderWidth: 2,
            borderDash: [5,5]
          }
        }
      }
    },
    scales: {
      x: {
        beginAtZero: true,
        max: 80,
        ticks: {callback: v => v + '%'}
      }
    }
  }
});
</script>
</body>
</html>
